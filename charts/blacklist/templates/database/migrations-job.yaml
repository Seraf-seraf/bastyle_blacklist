{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "blacklist.fullname" . }}-migrations
  labels:
    {{- include "blacklist.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "blacklist.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: BASTYLE_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bot.runtimeSecrets.database.name | quote }}
                  key: {{ .Values.bot.runtimeSecrets.database.key | quote }}
          command:
            - /bin/sh
            - -c
          args:
            - >
              until pg_isready
              -h {{ .Values.dependencies.postgresql.host | quote }}
              -p {{ .Values.dependencies.postgresql.port }}
              -U {{ .Values.dependencies.postgresql.owner | quote }};
              do
                echo "waiting for postgres...";
                sleep 2;
              done;

              goose
              -dir {{ .Values.migrations.dir }}
              -table postgres_schema_migrations
              postgres
              "$BASTYLE_DATABASE_DSN"
              up
{{- end }}
