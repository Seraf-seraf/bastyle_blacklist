{{- if .Values.aimatcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blacklist.fullname" . }}-aimatcher
  labels:
    {{- include "blacklist.labels" . | nindent 4 }}
    app.kubernetes.io/component: aimatcher
spec:
  replicas: {{ default 1 .Values.aimatcher.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "blacklist.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: aimatcher
  template:
    metadata:
      {{- if .Values.metrics.podAnnotations.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.aimatcher.containerPort | quote }}
        prometheus.io/path: "/metrics"
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "blacklist.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: aimatcher
    spec:
      containers:
        - name: aimatcher
          image: "{{ .Values.aimatcher.image.repository }}:{{ .Values.aimatcher.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.aimatcher.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: {{ .Values.aimatcher.configPath }}
              subPath: {{ .Values.configSecret.configKey }}
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: {{ include "blacklist.configSecretName" . }}
{{- end }}
