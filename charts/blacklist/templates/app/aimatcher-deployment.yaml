{{- if .Values.aimatcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blacklist.fullname" . }}-aimatcher
  labels:
    {{- include "blacklist.labels" . | nindent 4 }}
    app.kubernetes.io/component: aimatcher
spec:
  replicas: {{ default 1 .Values.aimatcher.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "blacklist.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: aimatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "blacklist.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: aimatcher
    spec:
      containers:
        - name: aimatcher
          image: "{{ .Values.aimatcher.image.repository }}:{{ .Values.aimatcher.image.tag }}"
          imagePullPolicy: IfNotPresent
          {{- if (include "blacklist.botRuntimeSecretsEnabled" .) }}
          env:
            - name: BASTYLE_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bot.runtimeSecrets.database.name | quote }}
                  key: {{ .Values.bot.runtimeSecrets.database.key | quote }}
            - name: BASTYLE_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bot.runtimeSecrets.rabbitmq.name | quote }}
                  key: {{ .Values.bot.runtimeSecrets.rabbitmq.key | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.aimatcher.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: {{ .Values.aimatcher.configPath }}
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "blacklist.botConfigMapName" . }}
{{- end }}
