{{- $vault := default dict .Values.vault -}}
{{- if (default false $vault.enabled) }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: bastyle-rabbitmq-url
  labels:
    {{- include "bastyle.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vault.auth.name }}
  mount: {{ .Values.vault.rabbitmq.mount }}
  path: {{ .Values.vault.rabbitmq.path }}
  renewalPercent: 67
  destination:
    create: true
    overwrite: true
    name: {{ .Values.bot.runtimeSecrets.rabbitmq.name }}
    transformation:
      excludes:
        - ".*"
      templates:
        {{ .Values.bot.runtimeSecrets.rabbitmq.key }}:
          text: |
            {{`{{- printf "%s://%s:%s@`}}{{ .Values.dependencies.rabbitmq.host }}:{{ .Values.dependencies.rabbitmq.port }}{{ .Values.vault.rabbitmq.vhost }}{{`" "amqp" (get .Secrets "username") (get .Secrets "password") -}}`}}
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "bastyle.fullname" . }}-bot
{{- end }}
