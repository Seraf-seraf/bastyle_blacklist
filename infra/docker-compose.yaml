services:
  bastyle-blacklist:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.bot
    image: bastyle-blacklist:local
    restart: unless-stopped
    networks:
      - bastyle-internal
    environment:
      BASTYLE_DATABASE_DSN: ${BASTYLE_DATABASE_DSN:-postgres://bastyle:bastyle@bastyle-postgresql:5432/bastyle?sslmode=disable}
      BASTYLE_RABBITMQ_URL: ${BASTYLE_RABBITMQ_URL:-amqp://guest:guest@bastyle-rabbitmq:5672/}
      BASTYLE_TELEGRAM_TOKEN: ${BASTYLE_TELEGRAM_TOKEN:-}
    volumes:
      - ./infra/config/config.yaml:/etc/bastyle/config.yaml:ro
      - bastyle-blacklist-data:/var/lib/bastyle
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 512M
    depends_on:
      bastyle-migrations:
        condition: service_completed_successfully
      bastyle-postgresql:
        condition: service_healthy
      bastyle-rabbitmq:
        condition: service_healthy

  bastyle-aimatcher:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.aimatcher
    image: bastyle-aimatcher:local
    restart: unless-stopped
    networks:
      - bastyle-internal
    volumes:
      - ./infra/config/config.yaml:/etc/bastyle/config.yaml:ro
      - bastyle-aimatcher-data:/var/lib/bastyle
    depends_on:
      bastyle-postgresql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  bastyle-postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      bastyle-internal:
        aliases:
          - bastyle-postgresql-rw
    environment:
      POSTGRES_DB: bastyle
      POSTGRES_USER: bastyle
      POSTGRES_PASSWORD: bastyle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bastyle-postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bastyle -d bastyle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  bastyle-rabbitmq:
    image: rabbitmq:4.1.1-management
    restart: unless-stopped
    networks:
      bastyle-internal:
        aliases:
          - bastyle-rabbitmq.default.svc
    volumes:
      - bastyle-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  bastyle-migrations:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrations
    image: bastyle-migrations:local
    restart: "no"
    networks:
      - bastyle-internal
    volumes:
      - ./infra/config/config.yaml:/etc/bastyle/config.yaml:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >
        goose -dir /app/migrations -table postgres_schema_migrations postgres
        "$$(/bin/sh /app/infra/scripts/database-dsn.sh /etc/bastyle/config.yaml)" up
    depends_on:
      bastyle-postgresql:
        condition: service_healthy

  bastyle-postgres-exporter:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.postgres-exporter
    image: bastyle-postgres-exporter:local
    restart: unless-stopped
    networks:
      - bastyle-internal
    environment:
      DATA_SOURCE_NAME: ${BASTYLE_DATABASE_DSN:-postgres://bastyle:bastyle@bastyle-postgresql:5432/bastyle?sslmode=disable}
    command: ["--no-collector.wal"]
    depends_on:
      bastyle-postgresql:
        condition: service_healthy

  bastyle-prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    networks:
      - bastyle-internal
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bastyle-prometheus:/prometheus
    depends_on:
      bastyle-blacklist:
        condition: service_healthy
      bastyle-postgres-exporter:
        condition: service_started

  bastyle-grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    networks:
      - bastyle-internal
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/helm/bastyle/dashboards:/var/lib/grafana/dashboards:ro
      - bastyle-grafana:/var/lib/grafana
    depends_on:
      bastyle-prometheus:
        condition: service_started

volumes:
  bastyle-blacklist-data:
  bastyle-aimatcher-data:
  bastyle-postgresql:
  bastyle-rabbitmq:
  bastyle-prometheus:
  bastyle-grafana:

networks:
  bastyle-internal:
    name: bastyle-internal
