services:
  bastyle-blacklist:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.bot
    image: bastyle-blacklist:local
    restart: unless-stopped
    networks:
      - bastyle-internal
    volumes:
      - ./infra/config/config.yaml:/etc/bastyle/config.yaml:ro
      - bastyle-blacklist-data:/var/lib/bastyle
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 512M
    depends_on:
      bastyle-postgresql:
        condition: service_healthy
      bastyle-rabbitmq:
        condition: service_started

  bastyle-aimatcher:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.aimatcher
    image: bastyle-aimatcher:local
    restart: unless-stopped
    networks:
      - bastyle-internal
    volumes:
      - ./infra/config/config.yaml:/etc/bastyle/config.yaml:ro
      - bastyle-aimatcher-data:/var/lib/bastyle
    depends_on:
      bastyle-postgresql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  bastyle-postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - bastyle-internal
    environment:
      POSTGRES_DB: bastyle
      POSTGRES_USER: bastyle
      POSTGRES_PASSWORD: bastyle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bastyle-postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bastyle -d bastyle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  bastyle-rabbitmq:
    image: rabbitmq:4.1.1-management
    restart: unless-stopped
    networks:
      - bastyle-internal
    volumes:
      - bastyle-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

volumes:
  bastyle-blacklist-data:
  bastyle-aimatcher-data:
  bastyle-postgresql:
  bastyle-rabbitmq:

networks:
  bastyle-internal:
    name: bastyle-internal
