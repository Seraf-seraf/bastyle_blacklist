services:
  bastyle-blacklist:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.bot
    image: bastyle-blacklist:local
    restart: unless-stopped
    volumes:
      - ./config/config.yaml:/etc/bastyle/config.yaml:ro
      - bastyle-data:/var/lib/bastyle
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 512M
    depends_on:
      - bastyle-rabbitmq

  bastyle-aimatcher:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.aimatcher
    image: bastyle-aimatcher:local
    restart: unless-stopped
    volumes:
      - ./config/config.yaml:/app/infra/config/config.yaml:ro
      - bastyle-data:/var/lib/bastyle
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  bastyle-rabbitmq:
    image: rabbitmq:4.1.1-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - bastyle-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

volumes:
  bastyle-data:
  bastyle-rabbitmq:
