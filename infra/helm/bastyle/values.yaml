postgresql:
  enabled: true
  clusterName: "bastyle-postgresql"
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:16"
  storageSize: "10Gi"
  database: "bastyle"
  owner: "bastyle"
  existingSecret: "bastyle-postgresql"
  existingSecretUsernameKey: "username"
  existingSecretPasswordKey: "password"

migrations:
  enabled: true
  backoffLimit: 0
  dir: "/app/migrations"
  image:
    repository: "bastyle-migrations"
    tag: "local"

serviceAccount:
  name: "bastyle-blacklist"

bot:
  replicaCount: 2
  image:
    repository: "your-registry/bastyle-blacklist"
    tag: "latest"
  containerPort: 8081
  metricsPort: 9090
  configPath: "/etc/bastyle/config.yaml"
  runtimeSecrets:
    enabled: true
    database:
      name: "bastyle-postgres-runtime"
      key: "BASTYLE_DATABASE_DSN"
    rabbitmq:
      name: "bastyle-rabbitmq-runtime"
      key: "BASTYLE_RABBITMQ_URL"
    telegram:
      name: "bastyle-telegram-runtime"
      key: "BASTYLE_TELEGRAM_TOKEN"

aimatcher:
  enabled: true
  image:
    repository: "your-registry/bastyle-aimatcher"
    tag: "latest"
  containerPort: 8080
  configPath: "/etc/bastyle/config.yaml"

service:
  type: ClusterIP

configSecret:
  existingSecret: "bastyle-config"
  configKey: "config.yaml"

vault:
  enabled: true
  auth:
    name: "bastyle-vault-auth"
    mount: "kubernetes"
    role: "bastyle-blacklist"
  postgres:
    mount: "database"
    path: "creds/bastyle-app"
    serviceHost: "bastyle-postgresql-rw"
    servicePort: 5432
    database: "bastyle"
    sslMode: "disable"
  rabbitmq:
    mount: "rabbitmq"
    path: "creds/bastyle-app"
    serviceHost: "bastyle-rabbitmq"
    servicePort: 5672
    vhost: "/"
  telegram:
    mount: "kv"
    path: "bastyle/telegram"
    refreshAfter: "1h"

rabbitmq:
  enabled: true
  clusterName: "bastyle-rabbitmq"
  replicas: 3
  image: "rabbitmq:4.1.1-management"
  persistence:
    storage: "5Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

monitoring:
  enabled: true
  prometheus:
    enabled: true
    image: "prom/prometheus:v2.55.1"
    scrapeInterval: "15s"
    retention: "7d"
    containerPort: 9090
    persistence:
      enabled: true
      storageSize: "5Gi"
      storageClassName: ""
  postgresExporter:
    enabled: true
    image:
      repository: "bastyle-postgres-exporter"
      tag: "local"
    containerPort: 9187
  grafana:
    enabled: true
    image: "grafana/grafana:11.5.0"
    containerPort: 3000
    service:
      type: NodePort
      nodePort: 30000
    adminUser: "admin"
    existingSecret: "bastyle-grafana-admin"
    existingSecretPasswordKey: "admin-password"
    persistence:
      enabled: true
      storageSize: "2Gi"
      storageClassName: ""
