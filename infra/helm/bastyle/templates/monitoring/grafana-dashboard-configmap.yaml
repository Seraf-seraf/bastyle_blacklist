{{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bastyle.fullname" . }}-grafana-dashboards
  labels:
    {{- include "bastyle.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  bastyle-overview.json: |
{{ .Files.Get "dashboards/bastyle-overview.json" | nindent 4 }}
{{- end }}
