{{- if (include "bastyle.legacyExternalConfigEnabled" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bastyle-secret-reader
  labels:
    {{- include "bastyle.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bastyle-secret-reader
  labels:
    {{- include "bastyle.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bastyle-secret-reader
  labels:
    {{- include "bastyle.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
subjects:
  - kind: ServiceAccount
    name: bastyle-secret-reader
roleRef:
  kind: Role
  name: bastyle-secret-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
