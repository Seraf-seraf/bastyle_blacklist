{{- if (include "bastyle.legacyExternalConfigEnabled" .) }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bastyle-kubernetes-store
  labels:
    {{- include "bastyle.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace | quote }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: bastyle-secret-reader
{{- end }}
