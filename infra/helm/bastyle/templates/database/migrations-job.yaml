{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bastyle.fullname" . }}-migrations
  labels:
    {{- include "bastyle.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bastyle.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - >
              until pg_isready -h {{ include "bastyle.fullname" . }}-postgresql -p 5432 -U {{ .Values.postgresql.user | quote }};
              do
                echo "waiting for postgres...";
                sleep 2;
              done;

              goose
              -dir {{ .Values.migrations.dir }}
              -table postgres_schema_migrations
              postgres
              "$(/bin/sh /app/infra/scripts/database-dsn.sh /etc/bastyle/config.yaml)"
              up
          volumeMounts:
            - name: config
              mountPath: /etc/bastyle/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: {{ include "bastyle.configSecretName" . }}
{{- end }}
