apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bastyle.fullname" . }}-bot
  labels:
    {{- include "bastyle.labels" . | nindent 4 }}
    app.kubernetes.io/component: bot
spec:
  replicas: {{ .Values.bot.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bastyle.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bastyle.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bot
    spec:
      containers:
        - name: bot
          image: "{{ .Values.bot.image.repository }}:{{ .Values.bot.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.bot.containerPort }}
              protocol: TCP
          args:
            - "-config"
            - "{{ .Values.bot.configPath }}"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: {{ .Values.bot.configPath }}
              subPath: {{ .Values.configSecret.configKey }}
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: {{ include "bastyle.configSecretName" . }}