telegram:
  token: "token"
  update_timeout_seconds: 5
  http_client:
    enabled: false
    proxy_url: ""

workers: 5
jobs_buffer: 100

health:
  enabled: true
  host: "127.0.0.1"
  port: 8081

media_config:
  max_animation_duration: 10s
  max_video_sticker_duration: 3s
  max_animation_size: 20MiB
  max_video_sticker_size: 256KiB
  max_frames: 10
  target_width: 320
  target_height: 320
  max_upload_bytes: 20MiB
  max_image_pixels: 16777216
  ffmpeg_binary: ffmpeg
  ffmpeg_timeout: 10s

matching:
  exact:
    buffer: 500
  image_hash:
    db_path: "bastyle.sqlite"
    threshold: 12
    buffer: 500
  video_like:
    db_path: "bastyle.sqlite"
    threshold: 12
    buffer: 500
    min_matched_frames: 2
    min_matched_ratio: 0.4
  ai_vector:
    enabled: false
    model_name: "nomic-ai/nomic-embed-vision-v1.5"
    model_revision: "e3a725bce72db07ca4adb1d83da08903f3ee02f8"
    device: "cpu"
    db_path: "bastyle.sqlite"
    index_path: "faiss-image.index"
    max_files: 10
    threshold: 0.92
    top_k: 5
    min_matched_frames: 2
    min_matched_ratio: 0.4
    request_timeout: 10s
    service:
      host: "bastyle-ai-vector"
      port: 8080
    hnsw:
      m: 32
      ef_construction: 80
      ef_search: 64
