telegram:
  token: "token"
  update_timeout_seconds: 5
  http_client:
    enabled: false
    proxy_url: ""

workers: 5
health:
  enabled: true
  address: "127.0.0.1:8081"
jobs_buffer: 100

matching:
  exact:
    buffer: 500
  image_hash:
    db_path: "bastyle.sqlite"
    threshold: 12
    buffer: 500
  video_like:
    enabled: true
    max_animation_duration: 10s
    max_video_sticker_duration: 3s
    max_animation_size: 20MiB
    max_video_sticker_size: 256KiB
    db_path: "bastyle.sqlite"
    threshold: 12
    buffer: 500
    min_matched_frames: 2
    min_matched_ratio: 0.4
    max_frames: 10
    target_width: 320
    target_height: 320
    ffmpeg_binary: ffmpeg
    ffmpeg_timeout: 10s
  ai_vector:
    enabled: false
    model_name: "nomic-ai/nomic-embed-vision-v1.5"
    model_revision: "e3a725bce72db07ca4adb1d83da08903f3ee02f8"
    device: "cpu"
    max_files: 10
    max_upload_bytes: 20971520
    max_image_pixels: 16777216
    target_width: 320
    target_height: 320
    threshold: 0.92
    service:
      host: "0.0.0.0"
      port: 8080
