name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - "dev_*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/bot/go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/aimatcher/ai_vector_service/requirements-dev.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r services/aimatcher/ai_vector_service/requirements-dev.txt

      - name: Run Python tests
        run: PYTHONPATH=services/aimatcher .venv/bin/python -m pytest services/aimatcher/ai_vector_service/tests

      - name: Run CI
        run: make ci

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: bastyle-blacklist
            dockerfile: infra/docker/Dockerfile.bot
          - name: bastyle-aimatcher
            dockerfile: infra/docker/Dockerfile.aimatcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.image.dockerfile }} -t ${{ matrix.image.name }}:ci .
